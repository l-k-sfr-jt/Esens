name: PR CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, test, staging]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Check
        run: pnpm lint

      - name: Format Check
        run: pnpm format:check

      - name: TypeScript Check
        run: pnpm tsc --noEmit

      - name: Run Frontend Tests (Jest)
        run: pnpm test:frontend

      # Backend tests require Convex deployment and codegen
      # Skip in CI for now - run locally with: pnpm test:backend
      # - name: Run Backend Tests (Vitest)
      #   run: pnpm test:backend

      - name: Build Next.js
        run: pnpm build
